# Local development infrastructure: PostgreSQL + Redis.
#
# These are the stateful dependencies the backend needs. The app servers
# themselves run with `npm run dev` in backend/ and frontend/ (no Dockerfiles
# are shipped for the apps yet). The defaults below match the backend's dev
# fallbacks in src/config/database.ts (localhost:5432, db "career_guidance")
# and src/config/redis.ts (localhost:6379).
#
#   docker compose up -d     # start Postgres + Redis
#   docker compose down      # stop (data is preserved in named volumes)
#   docker compose down -v   # stop and wipe all data
#
# Ports already in use? (e.g. a Postgres installed on the host, or another
# project's container, already listening on 5432.) Pick other HOST ports; the
# containers still listen on 5432/6379 internally:
#   POSTGRES_PORT=55432 REDIS_PORT=56379 docker compose up -d
# (or put POSTGRES_PORT / REDIS_PORT in a .env file next to this one.)
#
# Pointing the backend at it: with the default port the backend's built-in
# fallback (localhost:5432, no DATABASE_URL) works as-is. With a custom port,
# set in backend/.env:
#   DATABASE_URL=postgresql://postgres:postgres@localhost:55432/career_guidance?sslmode=disable
#   REDIS_URL=redis://localhost:56379
# `sslmode=disable` is required: this container has no TLS, and the backend
# otherwise requests it (see resolveDatabaseSsl in src/config/database.ts;
# it is refused in production).
#
# After first start, provision the schema:
#   cd backend && psql "postgresql://postgres:${DB_PASSWORD:-postgres}@localhost:${POSTGRES_PORT:-5432}/career_guidance" -f src/config/schema.sql
# then `npm run migrate` to apply the migration deltas.

services:
  postgres:
    # pgvector's official image = stock Postgres 16 plus the `vector`
    # extension. Plain postgres:16-alpine lacks it, so a fresh database stopped
    # at migration 020 (rag_chunks). If you have a volume created by the old
    # alpine image, recreate it (`docker compose down -v`) rather than reuse
    # it: alpine (musl) and this Debian-based image can sort text differently,
    # which can silently break existing text indexes. It is dev data only.
    image: pgvector/pgvector:pg16
    container_name: cethub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: career_guidance
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cethub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d career_guidance"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cethub-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - cethub-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cethub-pgdata:
  cethub-redisdata:
