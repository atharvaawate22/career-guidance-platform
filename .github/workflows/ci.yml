name: CI

# Every branch, not just master. Feature work should go red before it is
# merged, not after — and with master now the only long-lived branch, a
# master-only trigger meant the first CI signal on any change arrived at merge
# time. Recovered from .github/workflows/main.yml, archived at tag
# archive/before-unify-20260330 and lost in the 2026-03-30 unify.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Coverage rather than plain `test`: same suite, but it fails the build if
      # coverage drops below the thresholds in vitest.config.ts. The suite is
      # fully offline (see tests/setup.ts), so this needs no services.
      - run: npm run test:coverage
      # `tsc` emit, on top of the `--noEmit` typecheck above. The two are not
      # redundant: typecheck proves the types are sound, this proves the build
      # actually produces dist/, which is what `npm start` runs in production.
      # Also recovered from the archived main.yml.
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Only the browser this project targets — installing all three trebles
      # the download for no extra signal on a smoke suite.
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts builds and boots its own server on 127.0.0.1:3001
      # via `webServer`, so there is nothing to start here. The spec existed and
      # was simply never wired into CI.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
