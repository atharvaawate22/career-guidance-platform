name: CI

# Every branch, not just master. Feature work should go red before it is
# merged, not after — and with master now the only long-lived branch, a
# master-only trigger meant the first CI signal on any change arrived at merge
# time. Recovered from .github/workflows/main.yml, archived at tag
# archive/before-unify-20260330 and lost in the 2026-03-30 unify.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Coverage rather than plain `test`: same suite, but it fails the build if
      # coverage drops below the thresholds in vitest.config.ts. The suite is
      # fully offline (see tests/setup.ts), so this needs no services.
      - run: npm run test:coverage
      # `tsc` emit, on top of the `--noEmit` typecheck above. The two are not
      # redundant: typecheck proves the types are sound, this proves the build
      # actually produces dist/, which is what `npm start` runs in production.
      # Also recovered from the archived main.yml.
      - run: npm run build
      # Read-only check that colleges.city_normalized still resolves to a real
      # Maharashtra district — see scripts/check_city_normalization.ts for why
      # this exists and what it can and can't verify. It queries the live
      # database, so it can only run where DATABASE_URL is configured as a
      # repo secret; `env` is scoped to this one step only; every other step
      # in this job never sees it. Skips with a clear message rather than
      # failing when the secret is absent, so adding this step doesn't turn CI
      # red for anyone who hasn't configured it yet.
      - name: City normalization guard
        if: ${{ secrets.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run check:city-normalization
      - name: City normalization guard (skipped — DATABASE_URL not configured)
        if: ${{ secrets.DATABASE_URL == '' }}
        run: echo "Skipping city normalization guard — DATABASE_URL secret is not configured."

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Only the browser this project targets — installing all three trebles
      # the download for no extra signal on a smoke suite.
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts builds and boots its own server on 127.0.0.1:3001
      # via `webServer`, so there is nothing to start here. The spec existed and
      # was simply never wired into CI.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
